<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>Sher Yadet Nare</title>

  <style>
    :root {
      --bg: #020617;
      --bg-elevated: #020617;
      --panel: #020617;
      --accent: #f97316;
      --accent-hover: #fb923c;
      --accent-soft: #fed7aa;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --line-hover: #111827;
      --border-subtle: #1f2937;
      --disabled: #374151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(circle at top, #0b1120, #020617 60%);

      color: var(--text-main);

      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: min(1180px, 100%);
      height: min(700px, 100%);

      display: flex;
      gap: 24px;

      padding: 24px;

      background:
        radial-gradient(circle at top left, #020617, #030712 60%);

      border-radius: 24px;

      box-shadow:
        0 24px 80px rgba(15, 23, 42, 0.85);

      border:
        1px solid rgba(148, 163, 184, 0.15);
    }

    /*
    -------------------------
    LEFT PANEL
    -------------------------
    */

    .left-panel {
      flex: 0 0 38%;

      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    h1 {
      margin: 0 0 4px;

      font-size: 1.6rem;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin: 0 0 18px;

      font-size: 0.9rem;

      color: var(--text-muted);
    }

    /*
    -------------------------
    CHALLENGE BOARD
    -------------------------
    */

    .challenge-header {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        78px
        78px;

      gap: 8px;

      padding: 0 4px 7px;

      color: var(--text-muted);

      font-size: 0.75rem;

      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .challenge-header span:nth-child(2),
    .challenge-header span:nth-child(3) {
      text-align: center;
    }

    .challenge-list {
      display: flex;
      flex-direction: column;

      gap: 7px;

      overflow-y: auto;

      padding-right: 4px;

      max-height: 400px;

      scrollbar-width: thin;

      scrollbar-color:
        #4b5563
        #020617;
    }

    .challenge-row {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        78px
        78px;

      align-items: center;

      gap: 8px;

      padding: 8px 10px;

      border:
        1px solid var(--border-subtle);

      border-radius: 12px;

      background:
        rgba(2, 6, 23, 0.85);

      transition:
        border-color 0.2s ease,
        background-color 0.2s ease;
    }

    .challenge-row:hover {
      border-color: #374151;

      background:
        rgba(15, 23, 42, 0.75);
    }

    .artist-name {
      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 0.94rem;

      font-weight: 600;
    }

    .difficulty-btn {
      border:
        1px solid rgba(249, 115, 22, 0.45);

      border-radius: 9px;

      padding: 7px 4px;

      cursor: pointer;

      background:
        rgba(249, 115, 22, 0.1);

      color: var(--accent-soft);

      font-size: 0.86rem;

      font-weight: 700;

      transition:
        transform 0.15s ease,
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .difficulty-btn:hover:not(:disabled) {
      transform: translateY(-1px);

      background:
        rgba(249, 115, 22, 0.2);

      border-color: var(--accent);

      box-shadow:
        0 5px 14px rgba(249, 115, 22, 0.15);
    }

    .difficulty-btn.selected {
      background:
        linear-gradient(
          135deg,
          #f97316,
          #ea580c
        );

      border-color: #fb923c;

      color: #111827;
    }

    .difficulty-btn:disabled {
      cursor: not-allowed;

      border-color: #293241;

      background: #111827;

      color: #4b5563;

      opacity: 0.65;
    }

    /*
    -------------------------
    NOW PLAYING
    -------------------------
    */

    .now-playing {
      margin-top: 16px;

      padding: 12px 14px;

      border:
        1px solid var(--border-subtle);

      border-radius: 14px;

      background:
        rgba(2, 6, 23, 0.85);
    }

    .now-playing-label {
      margin-bottom: 3px;

      color: var(--text-muted);

      font-size: 0.75rem;

      text-transform: uppercase;

      letter-spacing: 0.08em;
    }

    .now-playing-value {
      font-size: 0.95rem;

      font-weight: 600;
    }

    /*
    -------------------------
    AUDIO
    -------------------------
    */

    .audio-wrapper {
      margin-top: 12px;

      padding: 10px 12px;

      border-radius: 16px;

      background:
        #020617;

      border:
        1px solid var(--border-subtle);
    }

    audio {
      width: 100%;

      filter:
        drop-shadow(
          0 8px 20px rgba(15, 23, 42, 0.9)
        );
    }

    .footer-note {
      margin-top: auto;

      padding-top: 14px;

      font-size: 0.8rem;

      color: var(--text-muted);

      opacity: 0.9;
    }

    /*
    -------------------------
    RIGHT PANEL
    -------------------------
    */

    .right-panel {
      flex: 1;

      background: var(--bg-elevated);

      border-radius: 18px;

      padding: 16px 18px;

      border:
        1px solid var(--border-subtle);

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .lyrics-header {
      display: flex;

      justify-content: space-between;

      align-items: baseline;

      gap: 8px;
    }

    .lyrics-title {
      font-size: 1rem;

      font-weight: 600;
    }

    /*
    -------------------------
    LYRICS
    -------------------------
    */

    .lyrics {
      margin-top: 8px;

      flex: 1;

      overflow-y: auto;

      padding-right: 8px;

      direction: rtl;

      text-align: right;

      scrollbar-width: thin;

      scrollbar-color:
        #4b5563
        #020617;
    }

    .lyrics::-webkit-scrollbar {
      width: 6px;
    }

    .lyrics::-webkit-scrollbar-track {
      background: #020617;
    }

    .lyrics::-webkit-scrollbar-thumb {
      background-color: #4b5563;

      border-radius: 999px;
    }

    .line {
      padding: 6px 10px;

      border-radius: 10px;

      margin-bottom: 3px;

      color: var(--text-muted);

      font-size: 0.95rem;

      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .line:hover {
      background:
        var(--line-hover);
    }

    .line.active-line {
      color:
        var(--accent-soft);

      background:
        rgba(248, 153, 60, 0.18);

      transform:
        translateX(-6px);

      box-shadow:
        0 0 0 1px rgba(248, 153, 60, 0.4);
    }

    /*
    -------------------------
    GUESS / REVEAL
    -------------------------
    */

    .guess-line {
      display: flex;

      justify-content: flex-start;

      align-items: center;

      gap: 8px;
    }

    .reveal-inline-btn {
      padding: 4px 12px;

      border-radius: 999px;

      border:
        1px solid rgba(248, 250, 252, 0.1);

      background:
        radial-gradient(
          circle at top,
          #f97316,
          #ea580c
        );

      color: #0b1120;

      font-size: 0.8rem;

      cursor: pointer;

      letter-spacing: 0.03em;

      text-transform: uppercase;

      font-weight: 600;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.2s ease;

      white-space: nowrap;
    }

    .reveal-inline-btn:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 8px 16px rgba(248, 150, 70, 0.5);

      background:
        radial-gradient(
          circle at top,
          #fb923c,
          #f97316
        );
    }

    .reveal-inline-btn:active {
      transform:
        translateY(0);

      box-shadow: none;
    }

    /*
    -------------------------
    RESPONSIVE
    -------------------------
    */

    @media (max-width: 900px) {
      body {
        height: auto;

        min-height: 100vh;
      }

      .app {
        flex-direction: column;

        height: auto;

        margin: 12px;
      }

      .left-panel {
        flex-basis: auto;
      }

      .challenge-list {
        max-height: none;
      }

      .right-panel {
        min-height: 450px;
      }
    }
  </style>
</head>

<body>

  <div class="app" id="app">

    <!-- LEFT PANEL -->
    <div class="left-panel">

      <div>
        <h1>Sher Yadet Nare</h1>

        <p class="subtitle">
          Choose an artist and difficulty.
        </p>

        <div class="challenge-header">
          <span>Artist</span>
          <span>500</span>
          <span>1000</span>
        </div>

        <!-- Filled dynamically by JavaScript -->
        <div
          id="challenge-list"
          class="challenge-list"
        ></div>

        <div class="now-playing">
          <div class="now-playing-label">
            Selected
          </div>

          <div
            id="now-playing"
            class="now-playing-value"
          >
            Choose a challenge
          </div>
        </div>

        <div class="audio-wrapper">
          <audio
            id="audio"
            controls
          ></audio>
        </div>

      </div>

      <div class="footer-note">
        Pause manually if players need more time.
        Click “Reveal Lyrics” to continue the song.
      </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

      <div class="lyrics-header">
        <div class="lyrics-title">
          Lyrics
        </div>
      </div>

      <div
        id="lyrics"
        class="lyrics"
      ></div>

    </div>

  </div>

  <script src="js/main.js"></script>

</body>
</html>
